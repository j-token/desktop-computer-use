name: Build and validate desktop computer use
on:
  workflow_dispatch:
  push:
    paths-ignore: ['orca-research/**']
  pull_request:
    paths-ignore: ['orca-research/**']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libx11-dev libxtst-dev libxrandr-dev libjpeg-dev libpng-dev libpipewire-0.3-dev libatspi2.0-dev nlohmann-json3-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            build/desktop-computer-use-native
            build/Release/desktop-computer-use-native.exe
          if-no-files-found: error
  adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bundle
      - run: bash extensions/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skill-adapters
          path: |
            skills/desktop-computer-use
            extensions/dist/*.zip
  package:
    needs: [native, adapters]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .cache/native-artifacts
      - run: npm ci
      - name: Assemble both platform executables
        run: |
          mkdir -p .cache/package-bin/win32-x64 .cache/package-bin/linux-x64
          find .cache/native-artifacts/native-windows-2022 -name desktop-computer-use-native.exe -exec cp '{}' .cache/package-bin/win32-x64/ \;
          find .cache/native-artifacts/native-ubuntu-22.04 -name desktop-computer-use-native -exec cp '{}' .cache/package-bin/linux-x64/ \;
          test -f .cache/package-bin/win32-x64/desktop-computer-use-native.exe
          test -f .cache/package-bin/linux-x64/desktop-computer-use-native
          chmod +x .cache/package-bin/linux-x64/desktop-computer-use-native
          bash extensions/package.sh
          npm run package:skill -- --native-dir .cache/package-bin --extension-dir extensions/dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-computer-use-skill
          path: dist/desktop-computer-use-skill
          if-no-files-found: error
          # .claude-plugin/ and .mcp.json are dotfiles, which upload-artifact skips by default.
          include-hidden-files: true
  release:
    # The release branch is the install source for the Claude Code plugin and
    # `npx skills add`: it carries the built bundle and both native binaries,
    # which the source branches never track.
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-computer-use-skill
          path: release
      - name: Publish the package to the release branch
        working-directory: release
        run: |
          chmod +x skills/desktop-computer-use/bin/linux-x64/desktop-computer-use-native
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
  github-release:
    # A pushed tag publishes a GitHub Release with the same package the release
    # branch carries, zipped with its dotfiles so the plugin layout survives.
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-computer-use-skill
          path: desktop-computer-use
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x desktop-computer-use/skills/desktop-computer-use/bin/linux-x64/desktop-computer-use-native
          zip -qr "desktop-computer-use-${TAG}.zip" desktop-computer-use
          gh release create "$TAG" "desktop-computer-use-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
