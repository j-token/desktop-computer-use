name: Release
# Actions 탭의 'Use workflow from' 드롭다운에서 브랜치를 고르고 버전을 입력해 수동으로 릴리즈를 만든다.
# 선택한 브랜치를 빌드·테스트한 뒤 v<version> 태그와 GitHub Release를 생성한다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 버전 숫자 (예 1.2.3, 앞의 v는 생략)
        required: true
        type: string
      prerelease:
        description: 프리릴리즈로 표시
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::버전 형식이 올바르지 않습니다: '$VERSION' (예: 1.2.3 또는 1.2.3-rc.1)"
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::태그 ${TAG} 가 이미 존재합니다."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: [validate]
    uses: ./.github/workflows/build.yml
    # build.yml의 release·github-release job이 contents: write를 선언하므로 호출 쪽 상한을 맞춰야 한다.
    # 두 job은 push 이벤트에서만 돌고, 나머지 job은 build.yml 최상위의 contents: read를 그대로 쓴다.
    permissions:
      contents: write
    with:
      ref: ${{ needs.validate.outputs.sha }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-computer-use-skill
          path: desktop-computer-use
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          chmod +x desktop-computer-use/skills/desktop-computer-use/bin/linux-x64/desktop-computer-use-native
          zip -qr "desktop-computer-use-${TAG}.zip" desktop-computer-use
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "desktop-computer-use-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$TAG" --generate-notes "${flags[@]}"
